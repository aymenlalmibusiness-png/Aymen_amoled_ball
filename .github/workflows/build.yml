name: Build Release AAB for Google Play

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Signed AAB via Cordova
        run: |
          npm install -g cordova
          cordova create gameApp com.aymen.amoledball "Aymen Amoled Ball"
          rm -rf gameApp/www/*
          cp -r ./* gameApp/www/ 2>/dev/null || true
          cd gameApp
          
          if [ -f "www/icon.png" ]; then
            sed -i '/<\/widget>/i \    <icon src="www/icon.png" />' config.xml
          fi
          
          if [ -f "www/splash.png" ]; then
            sed -i '/<\/widget>/i \    <preference name="AndroidWindowSplashScreenAnimatedIcon" value="www/splash.png" />' config.xml
            sed -i '/<\/widget>/i \    <preference name="AndroidWindowSplashScreenBackground" value="#000000" />' config.xml
          fi

          cordova platform add android
          cordova build android --release -- --packageType=bundle

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aymen-Amoled-Ball-Release
          path: gameApp/platforms/android/app/build/outputs/bundle/release/app-release.aab

name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK via Cordova
        run: |
          npm install -g cordova
          cordova create gameApp com.aymen.amoledball "Aymen Amoled Ball"
          rm -rf gameApp/www/*
          cp -r ./* gameApp/www/ 2>/dev/null || true
          cd gameApp
          cordova platform add android
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: gameApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          
